name: video_ingestion
description: Record and sync videos to your self-hosted Syncthing server via Mobius Sync.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Camera and media
  camera: ^0.10.5+9
  video_player: ^2.8.6

  # File system
  path_provider: ^2.1.3
  path: ^1.9.0

  # Settings persistence
  shared_preferences: ^2.2.3

  # State management
  provider: ^6.1.2

  # Permissions
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
